name: NasTech Auto-Sync

on:
  schedule:
    # Check for upstream commits every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Force full re-brand (ignores saved state)'
        required: false
        default: 'false'
        type: boolean
      dry_run:
        description: 'Dry run — brand locally but do NOT push or open a PR'
        required: false
        default: 'false'
        type: boolean

jobs:
  sync:
    name: Sync upstream → NasTech-Agent (PR)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout nasnyc
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install NasTech Sync
        run: pip install -e . --quiet

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: Configure Git identity
        run: |
          git config --global user.name "NasTech-Agent"
          git config --global user.email "agent@nastechai.com"

      - name: Run sync
        env:
          GITHUB_TOKEN: ${{ secrets.NASTECH_GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OLLAMA_URL: ${{ secrets.OLLAMA_URL }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.full_sync }}" = "true" ]; then
            FLAGS="$FLAGS --full"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          python -m nastech_sync -v sync $FLAGS

      - name: Upload sync log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-log-${{ github.run_id }}
          path: ~/.nastech-sync/sync.log
          retention-days: 7

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[NasTech Sync] Auto-sync failed at ${new Date().toISOString()}`,
              body: `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['sync-failure', 'automated']
            })
