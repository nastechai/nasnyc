name: NasTech Dependency Update

on:
  schedule:
    # Every Monday at 07:00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      ecosystem:
        description: 'Ecosystem to update (leave blank for all)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run — show what would update, do not commit'
        required: false
        default: 'false'
        type: boolean

jobs:
  dependency-update:
    name: Scan and update dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install NasTech Sync
        run: |
          pip install -e . --quiet
          pip install -r requirements.txt --quiet

      - name: Scan dependencies
        id: scan
        run: |
          python -m nastech_sync deps --scan-path . --format json > /tmp/dep-scan.json
          python -m nastech_sync deps --scan-path . --format markdown > /tmp/dep-scan.md
          echo "report=$(cat /tmp/dep-scan.json | python -c "import json,sys; d=json.load(sys.stdin); print(len(d.get('outdated',[]))) ")" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Check for outdated packages
        run: |
          cat /tmp/dep-scan.md || echo "No report generated"

      - name: Apply updates
        if: steps.scan.outputs.report != '0' && github.event.inputs.dry_run != 'true'
        run: |
          python -m nastech_sync deps --update --scan-path .

      - name: Commit updates
        if: steps.scan.outputs.report != '0' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "NasTech-Agent"
          git config user.email "agent@nastechai.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: NasTech auto-dependency update $(date +%Y-%m-%d)"

      - name: Create PR for updates
        if: steps.scan.outputs.report != '0' && github.event.inputs.dry_run != 'true'
        uses: actions/github-script@v7
        env:
          BRANCH: "nastech-deps/${{ github.run_id }}"
        with:
          script: |
            const branch = process.env.BRANCH;
            const report = require('fs').readFileSync('/tmp/dep-scan.md', 'utf8');

            // Push branch
            const { execSync } = require('child_process');
            execSync(`git checkout -b ${branch}`);
            execSync(`git push origin ${branch}`);

            // Open PR
            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `chore: NasTech auto-dependency update ${new Date().toISOString().split('T')[0]}`,
              body: `## 🤖 NasTech Auto-Dependency Update\n\n${report}\n\n_Generated by NasTech Deps workflow_`,
              head: branch,
              base: 'main',
            });

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dep-scan-${{ github.run_id }}
          path: |
            /tmp/dep-scan.json
            /tmp/dep-scan.md
          retention-days: 30
