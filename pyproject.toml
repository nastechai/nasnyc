[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "nastech-sync"
version = "2.0.0"
description = "Keeps nastechai/NasTech-Agent in sync with NousResearch/hermes-agent — universal dep scanner, GitHub Actions bots, brain awareness"
authors = [{ name = "NasTech", email = "agent@nastechai.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "schedule>=1.2.0",
    "colorama>=0.4.6",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "packaging>=24.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
full = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-telegram-bot>=21.0",
    "openai>=1.0.0",
    "markdown2>=2.4.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.0.0",
    "gitpython>=3.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
nastech-sync = "nastech_sync.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nastech_sync*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["nastech_sync"]
omit = ["tests/*", "nastech_sync/__main__.py"]
