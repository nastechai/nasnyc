[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "nastech-sync"
version = "1.0.0"
description = "Keeps nastechai/NasTech-Agent in sync with NousResearch/hermes-agent with NasTech branding"
authors = [{ name = "NasTech", email = "agent@nastechai.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "schedule>=1.2.0",
    "colorama>=0.4.6",
    "requests>=2.31.0",
]

[project.scripts]
nastech-sync = "nastech_sync.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nastech_sync*"]
